<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>THESE PRETTY EYES</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
scroll-behavior:smooth;
}

body{
font-family:'Cormorant Garamond',serif;
background:linear-gradient(180deg,#f8ebc4,#f3df9a,#edd28a);
overflow-x:hidden;
color:#4b3723;
}

/* PASSWORD */

#lockscreen{
position:fixed;
inset:0;
background:linear-gradient(135deg,#f8ebc4,#e6c26a);
display:flex;
justify-content:center;
align-items:center;
z-index:9999;
transition:1s;
}

.card{
background:rgba(255,255,255,.15);
backdrop-filter:blur(20px);
padding:40px;
border-radius:30px;
text-align:center;
box-shadow:0 20px 60px rgba(0,0,0,.15);
}

.card h2{
letter-spacing:4px;
margin-bottom:15px;
}

.card input{
width:230px;
padding:14px;
border:none;
border-radius:15px;
outline:none;
}

.card button{
margin-top:15px;
padding:12px 30px;
border:none;
border-radius:15px;
background:#c79b37;
color:white;
cursor:pointer;
font-size:16px;
}

#error{
margin-top:10px;
color:#b92b2b;
}

#site{
display:none;
}

/* HERO */

.hero{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
position:relative;
overflow:hidden;
}

.hero::before{
content:"";
position:absolute;
width:900px;
height:900px;
background:radial-gradient(circle,
rgba(255,228,120,.35),
transparent 70%);
filter:blur(60px);
animation:pulse 8s infinite ease-in-out;
}

.hero h1{
font-size:clamp(3rem,8vw,7rem);
letter-spacing:12px;
font-weight:600;
z-index:2;
opacity:0;
animation:titleReveal 2s forwards;
}

.scroll{
position:absolute;
bottom:40px;
font-size:18px;
animation:float 2.5s infinite;
}

/* IMAGE SECTION */

.section{
min-height:120vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
padding:100px 10%;
}

.image-box{
width:min(550px,90%);
transform:translateY(100px);
opacity:0;
filter:blur(10px);
transition:1.8s cubic-bezier(.22,1,.36,1);
}

.image-box img{
width:100%;
border-radius:25px;
box-shadow:0 25px 60px rgba(0,0,0,.18);
}

.text{
margin-top:60px;
max-width:850px;
text-align:center;
font-size:clamp(1.2rem,2vw,1.8rem);
line-height:2;
transform:translateY(100px);
opacity:0;
filter:blur(10px);
transition:2s cubic-bezier(.22,1,.36,1);
}

.show{
opacity:1;
transform:translateY(0);
filter:blur(0);
}

/* ANIMATIONS */

@keyframes titleReveal{
from{
opacity:0;
transform:translateY(80px);
}
to{
opacity:1;
transform:translateY(0);
}
}

@keyframes pulse{
0%,100%{
transform:scale(1);
}
50%{
transform:scale(1.15);
}
}

@keyframes float{
0%,100%{
transform:translateY(0);
}
50%{
transform:translateY(-12px);
}
}

</style>
</head>
<body>

<div id="lockscreen">
<div class="card">
<h2>ENTER PASSWORD</h2>
<input id="pass" type="password" placeholder="Password">
<br>
<button onclick="unlock()">Unlock</button>
<p id="error"></p>
</div>
</div>

<div id="site">

<section class="hero">
<h1>THESE PRETTY EYES</h1>
<div class="scroll">Scroll Down ↓</div>
</section>

<section class="section">

<div class="image-box reveal">
<img src="IMG.1.jpg" alt="">
</div>

<div class="text reveal">
Your eyes have such a soft and beautiful charm to them, and that tiny bindi makes them look even more lovely. There's something so graceful and effortless about the way it all comes together. Simple, elegant, and genuinely beautiful.
</div>

</section>

</div>

<script>

function unlock(){
let p=document.getElementById("pass").value;

if(p==="ATM"){
document.getElementById("lockscreen").style.opacity="0";

setTimeout(()=>{
document.getElementById("lockscreen").style.display="none";
document.getElementById("site").style.display="block";
},900);

}else{
document.getElementById("error").innerText="Wrong Password";
}
}

const observer=new IntersectionObserver(entries=>{
entries.forEach(entry=>{
if(entry.isIntersecting){
entry.target.classList.add("show");
}
});
},{
threshold:.15
});

document.querySelectorAll(".reveal").forEach(el=>{
observer.observe(el);
});

/* subtle parallax */

window.addEventListener("scroll",()=>{
let y=window.scrollY;
document.querySelector(".hero").style.transform=
`translateY(${y*0.15}px)`;
});

</script>

</body>
</html>
